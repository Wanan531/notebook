<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>笔记本 · 思考与反思</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --paper: #FAF7F0;
    --paper-soft: #F2EDE3;
    --ink: #2B2826;
    --ink-soft: #5C564C;
    --ink-faint: #8A8479;
    --rule: #E3DDCD;
    --accent: #C2622D;
    --accent-soft: #E8D2BE;
    --accent-deep: #9B4A1E;
    --good: #5C7A52;
    --font-display: 'Source Serif Pro', Georgia, 'Songti SC', serif;
    --font-body: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'SF Mono', 'Courier New', monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  /* ============================================================
     MOBILE-FIRST BASE STYLES
     Everything below (until the "DESKTOP ENHANCEMENTS" media query
     near the end of this stylesheet) targets small/touch screens by
     default. Desktop is the progressive enhancement, not the other
     way around.
     ============================================================ */

  .app{
    display:block;
    min-height:100vh;
    background-image:
      linear-gradient(var(--paper) 0%, var(--paper) 100%);
  }

  /* ---------- mobile top bar (brand strip) ---------- */
  .mobile-topbar{
    position:sticky;
    top:0;
    z-index:30;
    display:flex;
    align-items:center;
    background:var(--paper);
    border-bottom:1px solid var(--rule);
    padding:14px 18px;
  }
  .mobile-topbar-brand{
    font-family:var(--font-display);
    font-size:17px;
    font-weight:600;
    color:var(--ink);
  }
  .brand .dot, .mobile-topbar-brand .dot{ color:var(--accent); }

  /* ---------- bottom tab bar (mobile primary nav) ---------- */
  .bottom-nav{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:40;
    display:flex;
    background:#fff;
    border-top:1px solid var(--rule);
    padding:6px 6px max(8px, env(safe-area-inset-bottom));
    box-shadow:0 -2px 14px rgba(43,40,38,0.04);
  }
  .bottom-nav-item{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    min-height:50px;
    border-radius:10px;
    color:var(--ink-faint);
    cursor:pointer;
    user-select:none;
  }
  .bottom-nav-item.active{ color:var(--accent-deep); }
  .bottom-nav-icon{ width:21px; height:21px; display:inline-flex; }
  .bottom-nav-icon svg{ width:100%; height:100%; }
  .bottom-nav-label{ font-size:11px; font-weight:600; }

  /* ---------- sidebar (desktop only — see media query below) ---------- */
  .sidebar{
    display:none;
    width:220px;
    flex:0 0 220px;
    border-right:1px solid var(--rule);
    padding:28px 18px;
    flex-direction:column;
    gap:6px;
  }
  .brand{
    font-family:var(--font-display);
    font-size:20px;
    font-weight:600;
    letter-spacing:0.01em;
    margin:0 6px 28px 6px;
    color:var(--ink);
  }

  .nav-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border-radius:6px;
    cursor:pointer;
    color:var(--ink-soft);
    font-size:14.5px;
    transition:background .15s, color .15s;
    user-select:none;
  }
  .nav-item:hover{ background:var(--paper-soft); color:var(--ink); }
  .nav-item.active{
    background:var(--accent-soft);
    color:var(--accent-deep);
    font-weight:600;
  }
  .nav-item .count{
    margin-left:auto;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--ink-faint);
  }
  .nav-item.active .count{ color:var(--accent-deep); }

  .sidebar-divider{
    height:1px;
    background:var(--rule);
    margin:18px 6px;
  }

  .sidebar-footer{
    margin-top:auto;
    padding:0 6px;
    font-size:11.5px;
    color:var(--ink-faint);
    line-height:1.6;
  }

  /* ---------- main ---------- */
  .main{
    flex:1;
    min-width:0;
    padding:20px 16px calc(84px + env(safe-area-inset-bottom));
    max-width:880px;
  }

  .topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:4px;
  }
  .view-title{
    font-family:var(--font-display);
    font-size:23px;
    margin:0;
  }
  .view-sub{
    color:var(--ink-faint);
    font-size:13px;
    margin:4px 0 18px;
  }

  .toolbar{
    display:flex;
    gap:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
    align-items:center;
  }
  .search-box{
    flex:1 1 100%;
    min-width:160px;
    position:relative;
  }
  .search-box input{
    width:100%;
    padding:12px 12px 12px 34px;
    border:1px solid var(--rule);
    border-radius:9px;
    background:#fff;
    font-size:15px;
    color:var(--ink);
    outline:none;
    font-family:var(--font-body);
  }
  .search-box input:focus{ border-color:var(--accent); }
  .search-box svg{
    position:absolute; left:11px; top:50%; transform:translateY(-50%);
    width:15px; height:15px; color:var(--ink-faint);
  }

  button.btn{
    border:1px solid var(--rule);
    background:#fff;
    color:var(--ink-soft);
    padding:11px 16px;
    min-height:44px;
    border-radius:9px;
    font-size:14.5px;
    cursor:pointer;
    font-family:var(--font-body);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    transition:border-color .15s, color .15s, background .15s;
    white-space:nowrap;
  }
  button.btn:hover{ border-color:var(--ink-faint); color:var(--ink); }
  button.btn.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:600;
  }
  button.btn.primary:hover{ background:var(--accent-deep); border-color:var(--accent-deep); }
  button.btn svg{ width:15px; height:15px; flex:0 0 auto; }
  button.btn:disabled{ opacity:.45; cursor:default; }
  button.btn.block{ width:100%; flex:1 1 100%; }

  .tag-filter{
    display:flex; gap:7px; flex-wrap:wrap; margin-bottom:16px;
    -webkit-overflow-scrolling:touch;
  }
  .tag-chip{
    padding:7px 13px;
    border-radius:20px;
    background:var(--paper-soft);
    color:var(--ink-soft);
    font-size:12.5px;
    cursor:pointer;
    border:1px solid transparent;
    white-space:nowrap;
  }
  .tag-chip.active{
    background:var(--accent-soft);
    color:var(--accent-deep);
    border-color:var(--accent-soft);
    font-weight:600;
  }

  /* ---------- cards ---------- */
  .empty-state{
    border:1px dashed var(--rule);
    border-radius:10px;
    padding:48px 24px;
    text-align:center;
    color:var(--ink-faint);
    font-size:14px;
  }
  .empty-state .big{
    font-family:var(--font-display);
    font-size:17px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }

  .card-list{ display:flex; flex-direction:column; gap:12px; }

  .note-card{
    background:#fff;
    border:1px solid var(--rule);
    border-radius:10px;
    padding:16px 18px;
    cursor:pointer;
    transition:border-color .15s, box-shadow .15s;
    position:relative;
  }
  .note-card:hover{
    border-color:var(--ink-faint);
    box-shadow:0 2px 10px rgba(43,40,38,0.05);
  }
  .note-card-top{
    display:flex; justify-content:space-between; align-items:baseline; gap:10px;
  }
  .note-card-title{
    font-family:var(--font-display);
    font-size:16.5px;
    font-weight:600;
    margin:0;
    color:var(--ink);
  }
  .note-card-date{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--ink-faint);
    white-space:nowrap;
  }
  .note-card-preview{
    color:var(--ink-soft);
    font-size:13.5px;
    line-height:1.6;
    margin:8px 0 10px;
    overflow:hidden;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }
  .note-card-tags{ display:flex; gap:6px; flex-wrap:wrap; }
  .mini-tag{
    font-size:11px;
    padding:2px 8px;
    border-radius:20px;
    background:var(--paper-soft);
    color:var(--ink-soft);
  }

  /* reflection card has a binder-line signature element */
  .reflect-card{
    background:#fff;
    border:1px solid var(--rule);
    border-radius:10px;
    padding:16px 18px 16px 22px;
    cursor:pointer;
    position:relative;
    transition:border-color .15s, box-shadow .15s;
    border-left:3px solid var(--accent-soft);
  }
  .reflect-card:hover{
    border-color:var(--ink-faint);
    border-left-color:var(--accent);
    box-shadow:0 2px 10px rgba(43,40,38,0.05);
  }
  .reflect-card-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .reflect-date{
    font-family:var(--font-display);
    font-size:16px;
    font-weight:600;
  }
  .reflect-weekday{
    font-size:11.5px; color:var(--ink-faint); margin-left:8px; font-weight:400;
  }
  .mood-badge{ font-size:18px; }
  .reflect-preview{
    color:var(--ink-soft); font-size:13.5px; line-height:1.6; margin-top:8px;
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  }

  /* ---------- editor ---------- */
  .editor{
    background:#fff;
    border:1px solid var(--rule);
    border-radius:12px;
    padding:18px;
  }
  .editor-header{
    display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:center; margin-bottom:16px;
  }
  .editor-back{
    color:var(--ink-faint);
    font-size:14px;
    cursor:pointer;
    display:flex; align-items:center; gap:5px;
    background:none; border:none; padding:6px 0; font-family:var(--font-body);
    min-height:32px;
  }
  .editor-back:hover{ color:var(--ink); }
  .editor-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  /* Save lives in the fixed mobile-save-bar on small screens, and only
     reappears inline here once the desktop layout kicks in. */
  .editor-actions .save-trigger.desktop-save-btn{ display:none; }

  /* sticky save bar — primary action, thumb-reachable, mobile only */
  .mobile-save-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:45;
    background:#fff;
    border-top:1px solid var(--rule);
    padding:12px 16px max(12px, env(safe-area-inset-bottom));
  }
  .mobile-save-bar .btn{ width:100%; padding:13px; font-size:15px; }

  .field-label{
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ink-faint);
    margin:0 0 6px;
    font-weight:600;
  }
  input.title-input{
    width:100%;
    border:none;
    font-family:var(--font-display);
    font-size:21px;
    font-weight:600;
    color:var(--ink);
    outline:none;
    padding:0;
    margin-bottom:6px;
    background:transparent;
  }
  input.title-input::placeholder{ color:var(--ink-faint); font-weight:400; }

  .meta-row{
    display:flex; gap:16px; align-items:center; margin-bottom:18px;
    font-size:12px; color:var(--ink-faint); flex-wrap:wrap;
  }
  input.tags-input{
    border:1px solid var(--rule);
    border-radius:7px;
    padding:9px 11px;
    font-size:13px;
    outline:none;
    font-family:var(--font-body);
    min-width:200px;
    flex:1;
  }
  input.tags-input:focus{ border-color:var(--accent); }

  textarea.content-input{
    width:100%;
    min-height:300px;
    border:none;
    outline:none;
    resize:vertical;
    font-size:15px;
    line-height:1.85;
    font-family:var(--font-body);
    color:var(--ink);
    padding:0;
    background:transparent;
  }
  textarea.content-input::placeholder{ color:var(--ink-faint); }

  hr.soft{ border:none; border-top:1px solid var(--rule); margin:18px 0; }

  /* reflection prompt blocks */
  .prompt-block{ margin-bottom:22px; }
  .prompt-block label{
    display:block;
    font-family:var(--font-display);
    font-size:14.5px;
    font-weight:600;
    color:var(--accent-deep);
    margin-bottom:8px;
  }
  .prompt-block textarea{
    width:100%;
    border:1px solid var(--rule);
    border-radius:8px;
    padding:12px 14px;
    font-size:14px;
    line-height:1.7;
    font-family:var(--font-body);
    color:var(--ink);
    outline:none;
    resize:vertical;
    min-height:70px;
    background:var(--paper);
  }
  .prompt-block textarea:focus{ border-color:var(--accent); background:#fff; }

  .mood-row{ display:flex; gap:10px; margin-bottom:22px; flex-wrap:wrap; }
  .mood-option{
    width:46px; height:46px;
    border-radius:50%;
    border:2px solid var(--rule);
    background:#fff;
    font-size:20px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:border-color .15s, transform .1s;
  }
  .mood-option:hover{ transform:translateY(-2px); }
  .mood-option.selected{ border-color:var(--accent); background:var(--accent-soft); }

  .date-picker-row{ display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  input.date-input{
    border:1px solid var(--rule);
    border-radius:7px;
    padding:9px 11px;
    font-family:var(--font-mono);
    font-size:13.5px;
    outline:none;
  }
  input.date-input:focus{ border-color:var(--accent); }

  .toast{
    position:fixed;
    bottom:24px; left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--ink);
    color:var(--paper);
    padding:10px 20px;
    border-radius:8px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
    z-index:50;
    box-shadow:0 8px 24px rgba(0,0,0,0.2);
    max-width:80vw;
    text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.error{ background:#8C3A24; }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(43,40,38,0.4);
    display:flex; align-items:center; justify-content:center;
    z-index:100;
    padding:20px;
  }
  .modal-box{
    background:#fff; border-radius:12px; padding:22px 22px;
    width:min(340px, 100%); box-shadow:0 20px 60px rgba(0,0,0,0.25);
  }
  .modal-box h3{ margin:0 0 8px; font-family:var(--font-display); font-size:17px; }
  .modal-box p{ margin:0 0 18px; font-size:13.5px; color:var(--ink-soft); line-height:1.6; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; }

  .loading-overlay{
    position:fixed; inset:0; background:rgba(250,247,240,0.85);
    display:flex; align-items:center; justify-content:center;
    font-size:14px; color:var(--ink-soft); z-index:200;
  }
  .hidden{ display:none !important; }

  /* off-screen container used only to rasterize content for PDF export */
  .pdf-render-root{
    position:fixed;
    left:-99999px;
    top:0;
    background:#ffffff;
    z-index:-1;
  }

  /* ============================================================
     DESKTOP ENHANCEMENTS
     Mobile is the default above; from here on we progressively
     enhance for larger, pointer-driven screens.
     ============================================================ */
  @media (min-width: 860px){
    .mobile-topbar{ display:none; }
    .bottom-nav{ display:none; }
    .mobile-save-bar{ display:none; }

    .app{ display:flex; }
    .sidebar{ display:flex; }

    .main{ padding:36px 48px 60px; max-width:880px; }
    .view-title{ font-size:28px; }
    .view-sub{ margin:4px 0 26px; }
    .toolbar{ margin-bottom:22px; }
    .search-box{ flex:1 1 auto; }
    .search-box input{ padding:9px 12px 9px 32px; font-size:13.5px; }
    .search-box svg{ width:14px; height:14px; }
    button.btn{ padding:9px 14px; min-height:auto; font-size:13.5px; }
    button.btn svg{ width:14px; height:14px; }
    .tag-filter{ margin-bottom:18px; }
    .tag-chip{ padding:4px 10px; font-size:12px; }

    .editor{ padding:28px 32px; }
    .editor-header{ flex-wrap:nowrap; margin-bottom:18px; }
    .editor-back{ font-size:13px; }
    .editor-actions .save-trigger.desktop-save-btn{ display:inline-flex; }

    input.title-input{ font-size:24px; }
    input.tags-input{ padding:6px 10px; font-size:12.5px; flex:none; }
    .mood-option{ width:42px; height:42px; font-size:19px; }
    input.date-input{ padding:7px 10px; font-size:13px; }
  }

  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>

<div id="app" class="app"></div>
<div id="toast" class="toast"></div>
<div id="loading" class="loading-overlay hidden">载入中…</div>

<script type="text/javascript">
(function(){
  "use strict";

  /* ============ icons (inline svg strings) ============ */
  const ICONS = {
    notes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V8l-5-5z"/><path d="M14 3v5h5"/></svg>',
    reflect: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
    all: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="11" width="18" height="4" rx="1"/><rect x="3" y="18" width="18" height="3" rx="1"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>',
    pdf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 3v5h5" /><path d="M8 16h2.5a1.5 1.5 0 000-3H8v5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2m-7 0l1 13h6l1-13"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>'
  };

  /* ============ state ============ */
  let state = {
    view: "notes",          // notes | reflect | all
    notes: [],               // {id, title, content, tags:[], created, updated}
    reflections: [],         // {id, date, mood, highlight, challenge, grateful, tomorrow, created}
    editing: null,           // {type:'note'|'reflect', id: string|null}
    search: "",
    activeTag: null,
    loaded: false,
    saving: false,           // true while a save is in flight, used to disable export-all etc.
    exporting: false
  };

  const STORAGE_KEY_NOTES = "notebook:notes";
  const STORAGE_KEY_REFLECTIONS = "notebook:reflections";

  const MOODS = ["😊","🙂","😐","😔","😣","🤩","😴"];

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
  function fmtDate(iso){
    const d = new Date(iso);
    return d.toLocaleDateString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'});
  }
  function fmtDateTime(iso){
    const d = new Date(iso);
    return d.toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'}) + " " + d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  }
  function weekdayOf(dateStr){
    const days = ["周日","周一","周二","周三","周四","周五","周六"];
    return days[new Date(dateStr+"T00:00:00").getDay()];
  }
  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* ============ storage ============ */
  // PERSISTENCE BACKEND: this build runs as a standalone .html file opened
  // directly in a browser (not inside a Claude.ai artifact), so the
  // `window.storage` API that Claude.ai injects is NOT available here.
  // To keep the exact same async get/set/contract the rest of the app
  // already relies on, we provide a small localStorage-backed shim that
  // mimics window.storage's {key, value, shared} resolve shape and its
  // "resolve to null on failure instead of throwing" behavior. If a real
  // window.storage is ever present (e.g. this file is pasted into a
  // Claude.ai artifact), we use that instead and leave this app logic
  // untouched.
  const localStorageShim = {
    async get(key /*, shared */){
      try{
        const raw = window.localStorage.getItem(key);
        if(raw === null) return null;
        return { key, value: raw, shared: false };
      }catch(e){
        console.error("localStorage.getItem failed for key:", key, e);
        return null;
      }
    },
    async set(key, value /*, shared */){
      try{
        window.localStorage.setItem(key, value);
        return { key, value, shared: false };
      }catch(e){
        // e.g. quota exceeded, storage disabled in this browser/profile
        console.error("localStorage.setItem failed for key:", key, e);
        return null;
      }
    },
    async delete(key /*, shared */){
      try{
        window.localStorage.removeItem(key);
        return { key, deleted: true, shared: false };
      }catch(e){
        console.error("localStorage.removeItem failed for key:", key, e);
        return null;
      }
    },
    async list(prefix /*, shared */){
      try{
        const keys = [];
        for(let i=0; i<window.localStorage.length; i++){
          const k = window.localStorage.key(i);
          if(!prefix || (k && k.indexOf(prefix) === 0)) keys.push(k);
        }
        return { keys, prefix, shared: false };
      }catch(e){
        console.error("localStorage listing failed", e);
        return null;
      }
    }
  };

  // Use the real artifact storage API if present (so this same file still
  // works correctly if pasted into a Claude.ai artifact); otherwise fall
  // back to the localStorage-backed shim above.
  const storageBackend = (typeof window.storage !== "undefined" && window.storage)
    ? window.storage
    : localStorageShim;

  // IMPORTANT: storageBackend.set() can fail "silently" by resolving to null
  // instead of throwing (per the storage API contract). saveToStorage()
  // treats a null/falsy result as a real failure too, and the caller is told
  // whether the save actually succeeded.
  async function saveToStorage(key, value){
    try{
      const result = await storageBackend.set(key, value, false);
      if(!result){
        console.error("storage.set returned null/falsy for key:", key);
        return false;
      }
      return true;
    }catch(e){
      console.error("storage.set threw for key:", key, e);
      return false;
    }
  }

  async function loadAll(){
    if(state.loaded) return; // guard against any double-invocation of loadAll
    showLoading(true);
    try{
      try{
        const r = await storageBackend.get(STORAGE_KEY_NOTES, false);
        state.notes = r && r.value ? JSON.parse(r.value) : [];
      }catch(e){ state.notes = []; }
      try{
        const r2 = await storageBackend.get(STORAGE_KEY_REFLECTIONS, false);
        state.reflections = r2 && r2.value ? JSON.parse(r2.value) : [];
      }catch(e){ state.reflections = []; }
    }finally{
      state.loaded = true;
      showLoading(false);
      render();
    }
  }

  async function saveNotes(){
    return saveToStorage(STORAGE_KEY_NOTES, JSON.stringify(state.notes));
  }
  async function saveReflections(){
    return saveToStorage(STORAGE_KEY_REFLECTIONS, JSON.stringify(state.reflections));
  }

  /* ============ toast ============ */
  let toastTimer = null;
  function showToast(msg, isError){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.toggle("error", !!isError);
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> t.classList.remove("show"), isError ? 3600 : 2200);
  }
  function showLoading(on){
    document.getElementById("loading").classList.toggle("hidden", !on);
  }

  /* ============ render root ============ */
  function render(){
    const app = document.getElementById("app");
    const showBottomNav = !state.editing; // full-screen editor hides tab bar, gains sticky save bar instead
    app.innerHTML = topBarMobileHtml() + sidebarHtml() + mainHtml() + (showBottomNav ? bottomNavHtml() : "");
    bindEvents();
  }

    return `<div class="mobile-topbar">

    const noteCount = state.notes.length;
    const reflectCount = state.reflections.length;

    return [
      { key:'notes', icon:ICONS.notes, label:'笔记', count:noteCount },
      { key:'reflect', icon:ICONS.reflect, label:'每日反思', count:reflectCount },
      { key:'all', icon:ICONS.all, label:'全部归档', count:allCount }

  }

  function bottomNavHtml(){
    const items = navItems();
    function item(it){
      const active = state.view === it.key && !state.editing;
      return `<div class="bottom-nav-item ${active?'active':''}" data-nav="${it.key}">

      </div>`;
    }
    return `<div class="bottom-nav">${items.map(item).join("")}</div>`;
  }

  function sidebarHtml(){
    const items = navItems();
    function item(it){
      const active = state.view === it.key && !state.editing;
      return `<div class="nav-item ${active?'active':''}" data-nav="${it.key}">
        <span style="width:15px;height:15px;display:inline-flex">${it.icon}</span>

  function mainHtml(){
    if(state.editing) return editorHtml();
    if(state.view === "notes") return notesListHtml();
    if(state.view === "reflect") return reflectListHtml();

  /* ============ NOTES LIST ============ */
  function allTags(){
    const s = new Set();
    state.notes.forEach(n => (n.tags||[]).forEach(t => s.add(t)));
    return Array.from(s);
  }

  function filteredNotes(){
    let list = state.notes.slice().sort((a,b)=> b.updated.localeCompare(a.updated));
    if(state.activeTag) list = list.filter(n => (n.tags||[]).includes(state.activeTag));
    if(state.search.trim()){

      list = list.filter(n => (n.title+n.content).toLowerCase().includes(q));

  /* ============ ALL ARCHIVE ============ */
  function allListHtml(){
    const items = [
      ...state.notes.map(n=>({type:'note', sortKey:n.updated, data:n})),

      ${list.length ? `<div class="card-list">${list.map(it=> it.type==='note' ? noteCardHtml(it.data) : reflectCardHtml(it.data)).join("")}</div>` : `<div class="empty-state"><div class="big">还没有任何内容</div>去写一条笔记或一篇反思吧。</div>`}

            <button class="btn" id="deleteReflectBtn" type="button">${ICONS.trash} 删除</button>` : ""}

  /* ============ events ============ */
  function bindEvents(){
    document.querySelectorAll("[data-nav]").forEach(el=>{
      el.addEventListener("click", ()=>{
        state.view = el.getAttribute("data-nav");
        state.editing = null;
        state.search = "";
        state.activeTag = null;
        render();
      });
    });

    const exportAllBtn = document.getElementById("exportAllBtn");
    if(exportAllBtn) exportAllBtn.addEventListener("click", exportAllToPdf);

    const searchInput = document.getElementById("searchInput");
    if(searchInput){
      searchInput.addEventListener("input", e=>{ state.search = e.target.value; render(); restoreFocus("searchInput"); });
    }

    document.querySelectorAll("[data-tag]").forEach(el=>{
      el.addEventListener("click", ()=>{
        const t = el.getAttribute("data-tag");
        state.activeTag = t || null;
        render();
      });
    });

    const newNoteBtn = document.getElementById("newNoteBtn");
    if(newNoteBtn) newNoteBtn.addEventListener("click", ()=>{ state.editing = {type:'note', id:null}; render(); });

    const newReflectBtn = document.getElementById("newReflectBtn");
    if(newReflectBtn) newReflectBtn.addEventListener("click", ()=>{
      const existing = state.reflections.find(r=>r.date===todayStr());
      state.editing = {type:'reflect', id: existing ? existing.id : null};
      render();
    });

    document.querySelectorAll("[data-open-note]").forEach(el=>{
      el.addEventListener("click", ()=>{ state.editing = {type:'note', id: el.getAttribute("data-open-note")}; render(); });
    });
    document.querySelectorAll("[data-open-reflect]").forEach(el=>{
      el.addEventListener("click", ()=>{ state.editing = {type:'reflect', id: el.getAttribute("data-open-reflect")}; render(); });

    if(backBtn) backBtn.addEventListener("click", ()=>{ state.editing = null; render(); });

    if(state.editing){
      const saveHandler = state.editing.type === 'note' ? saveNoteFromEditor : saveReflectFromEditor;
      document.querySelectorAll(".save-trigger").forEach(btn=> btn.addEventListener("click", saveHandler));
    }

    const deleteNoteBtn = document.getElementById("deleteNoteBtn");
    if(deleteNoteBtn) deleteNoteBtn.addEventListener("click", ()=> confirmDelete('note', state.editing.id));

    const pdfNoteBtn = document.getElementById("pdfNoteBtn");
    if(pdfNoteBtn) pdfNoteBtn.addEventListener("click", ()=> exportNotePdf(getNote(state.editing.id)));

    const deleteReflectBtn = document.getElementById("deleteReflectBtn");
    if(deleteReflectBtn) deleteReflectBtn.addEventListener("click", ()=> confirmDelete('reflect', state.editing.id));

    const pdfReflectBtn = document.getElementById("pdfReflectBtn");
    if(pdfReflectBtn) pdfReflectBtn.addEventListener("click", ()=> exportReflectionPdf(getReflection(state.editing.id)));

    const moodRow = document.getElementById("moodRow");

    if(reflectDateInput){

  function restoreFocus(id){
    const el = document.getElementById(id);
    if(el){ el.focus(); const v = el.value; el.value=""; el.value=v; }
  }

  /* ============ save / delete handlers ============ */
  // NOTE ON THE "NOTES DISAPPEAR AFTER RELOAD" BUG:
  // saveNotes()/saveReflections() now return true/false depending on whether the
  // write actually succeeded (see saveToStorage above). We only leave the editor
  // and show "已保存" when the save truly succeeded. If it failed, we keep the
  // user in the editor with their text intact and let them retry, instead of
  // pretending it saved and quietly losing the entry.
  async function saveNoteFromEditor(){
    if(state.saving) return;
    const title = document.getElementById("noteTitleInput").value.trim();
    const content = document.getElementById("noteContentInput").value;
    const tagsRaw = document.getElementById("noteTagsInput").value;
    const tags = tagsRaw.split(",").map(t=>t.trim()).filter(Boolean);
    const now = new Date().toISOString();

    if(!title && !content.trim()){
      showToast("笔记内容为空，未保存");
      return;
    }

    // Keep a snapshot so we can roll back state.notes if the save fails after
    // we've already mutated it (needed for the "new note" push case).
    const isNew = !state.editing.id;
    const previousNotes = state.notes.slice();

    let targetId = state.editing.id;
    if(!isNew){
      const n = getNote(state.editing.id);
      n.title = title; n.content = content; n.tags = tags; n.updated = now;
    } else {
      targetId = uid();
      state.notes.push({id: targetId, title, content, tags, created: now, updated: now});
    }

    state.saving = true;
    render();

    const ok = await saveNotes();

    state.saving = false;

    if(!ok){
      state.notes = previousNotes; // roll back the in-memory change
      render();
      showToast("保存失败，请检查网络后重试", true);
      return;
    }

    state.editing = null;
    state.view = "notes";
    render();
    showToast("已保存");
  }

  async function saveReflectFromEditor(){
    if(state.saving) return;
    const date = document.getElementById("reflectDateInput").value || todayStr();
    const moodRow = document.getElementById("moodRow");
    const mood = moodRow ? (moodRow.dataset.selected || (moodRow.querySelector(".mood-option.selected")?.getAttribute("data-mood")) || "") : "";
    const highlight = document.getElementById("reflectHighlight").value;
    const challenge = document.getElementById("reflectChallenge").value;
    const grateful = document.getElementById("reflectGrateful").value;
    const tomorrow = document.getElementById("reflectTomorrow").value;
    const now = new Date().toISOString();

    const previousReflections = state.reflections.slice();

    if(state.editing.id){
      const r = getReflection(state.editing.id);
      r.date=date; r.mood=mood; r.highlight=highlight; r.challenge=challenge; r.grateful=grateful; r.tomorrow=tomorrow; r.updated=now;
    } else {
      // prevent duplicate same-day entries: merge into existing if found
      const existing = state.reflections.find(r=>r.date===date);
      if(existing){
        existing.mood=mood; existing.highlight=highlight; existing.challenge=challenge; existing.grateful=grateful; existing.tomorrow=tomorrow; existing.updated=now;
      } else {
        state.reflections.push({id: uid(), date, mood, highlight, challenge, grateful, tomorrow, created: now, updated: now});
      }
    }

    state.saving = true;
    render();

    const ok = await saveReflections();

    state.saving = false;

    if(!ok){
      state.reflections = previousReflections;
      render();
      showToast("保存失败，请检查网络后重试", true);
      return;
    }

    state.editing = null;
    state.view = "reflect";
    render();
    showToast("已保存");
  }

  function confirmDelete(type, id){
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `<div class="modal-box">
      <h3>确认删除？</h3>
      <p>删除后无法恢复，确定要删除这条${type==='note'?'笔记':'反思记录'}吗？</p>
      <div class="modal-actions">
        <button class="btn" id="cancelDel" type="button">取消</button>
        <button class="btn primary" id="confirmDel" type="button" style="background:#B3402A;border-color:#B3402A">删除</button>
      </div>
    </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector("#cancelDel").addEventListener("click", ()=> overlay.remove());
    overlay.querySelector("#confirmDel").addEventListener("click", async ()=>{
      const confirmBtn = overlay.querySelector("#confirmDel");
      confirmBtn.disabled = true;
      confirmBtn.textContent = "删除中…";

      let ok;
      let previous;
      if(type==='note'){
        previous = state.notes.slice();
        state.notes = state.notes.filter(n=>n.id!==id);
        ok = await saveNotes();
        if(ok) state.view = "notes"; else state.notes = previous;
      } else {
        previous = state.reflections.slice();
        state.reflections = state.reflections.filter(r=>r.id!==id);
        ok = await saveReflections();
        if(ok) state.view = "reflect"; else state.reflections = previous;
      }

      overlay.remove();

      if(!ok){
        showToast("删除失败，请检查网络后重试", true);
        return;
      }

      state.editing = null;
      render();
      showToast("已删除");
    });
  }

  /* ============ PDF export ============ */
  // WHY THE OLD PDF EXPORT SHOWED GARBLED TEXT:
  // jsPDF's built-in fonts (helvetica/times/courier) only encode the Latin
  // WinAnsi character set. Calling doc.text() with Chinese characters does not
  // throw an error -- it silently maps each CJK character to whatever random
  // glyph that byte value happens to represent in WinAnsi, which is what
  // produced the "乱码" (garbled characters).
  //
  // FIX: instead of asking jsPDF to draw text directly, we build a normal,
  // styled HTML element (using the same system fonts the rest of the app uses,
  // which DO support Chinese), and use jsPDF's html() method -- powered by
  // html2canvas -- to rasterize that real, correctly-rendered HTML into the
  // PDF. This guarantees the PDF shows exactly what's on screen.

  function newPdfDoc(){
    const { jsPDF } = window.jspdf;
    return new jsPDF({ unit: "pt", format: "a4" });
  }

  const PDF_PAGE_WIDTH_PT = 595.28; // A4 width in pt
  const PDF_MARGIN_PT = 40;
  const PDF_CONTENT_WIDTH_PT = PDF_PAGE_WIDTH_PT - PDF_MARGIN_PT * 2;

  // Renders `innerHtml` (a fragment) into an offscreen container, converts it
  // to a paginated PDF via jsPDF's html() (html2canvas-backed), saves it as
  // `filename`, and always cleans up the offscreen DOM node + UI state.
  function renderHtmlToPdf(innerHtml, filename){
    return new Promise((resolve, reject)=>{
      const container = document.createElement("div");
      container.className = "pdf-render-root";
      container.style.width = "640px"; // CSS px render width; scaled to fit the PDF page
      container.style.padding = "32px 36px";
      container.style.fontFamily = "-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif";
      container.style.color = "#2B2826";
      container.style.boxSizing = "border-box";
      container.innerHTML = innerHtml;
      document.body.appendChild(container);

      const cleanup = ()=>{
        if(container.parentNode) container.parentNode.removeChild(container);
      };

      try{
        const doc = newPdfDoc();
        doc.html(container, {
          x: PDF_MARGIN_PT,
          y: PDF_MARGIN_PT,
          width: PDF_CONTENT_WIDTH_PT,
          windowWidth: 640,
          autoPaging: "text",
          html2canvas: { scale: 2, useCORS: true, backgroundColor: "#ffffff" },
          callback: function(finishedDoc){
            cleanup();
            try{
              finishedDoc.save(filename);
              resolve();
            }catch(e){
              reject(e);
            }
          }
        });
      }catch(e){
        cleanup();
        reject(e);
      }
    });
  }

  function noteToPdfHtml(n){
    const tagsLine = (n.tags && n.tags.length) ? `　·　标签：${escapeHtml(n.tags.join(', '))}` : "";
    return `
      <div style="font-size:21px;font-weight:700;margin:0 0 6px;line-height:1.4;">${escapeHtml(n.title || "无标题笔记")}</div>
      <div style="font-size:11px;color:#8A8479;margin-bottom:16px;">更新于 ${fmtDateTime(n.updated)}${tagsLine}</div>
      <div style="border-top:1px solid #E3DDCD;margin-bottom:16px;"></div>
      <div style="font-size:13.5px;line-height:1.85;white-space:pre-wrap;">${escapeHtml(n.content && n.content.trim() ? n.content : "（空）")}</div>
    `;
  }

  function reflectionToPdfHtml(r){
    const sections = [
      ["今天最值得记下的事", r.highlight],
      ["遇到的困难或挑战", r.challenge],
      ["心怀感激的事", r.grateful],
      ["给明天的自己一句话", r.tomorrow]
    ];
    const sectionsHtml = sections.map(([label, text])=> `
      <div style="margin-bottom:16px;">
        <div style="font-size:13px;font-weight:700;color:#9B4A1E;margin-bottom:6px;">${escapeHtml(label)}</div>
        <div style="font-size:13px;line-height:1.8;white-space:pre-wrap;">${escapeHtml(text && text.trim() ? text : "（未填写）")}</div>
      </div>
    `).join("");
    return `
      <div style="font-size:19px;font-weight:700;margin:0 0 4px;">${fmtDate(r.date)} ${weekdayOf(r.date)} ${escapeHtml(r.mood||"")}</div>
      <div style="border-top:1px solid #E3DDCD;margin:12px 0 16px;"></div>
      ${sectionsHtml}
    `;
  }

  async function exportNotePdf(n){
    if(!n || state.exporting) return;
    state.exporting = true;
    render();
    try{
      await renderHtmlToPdf(noteToPdfHtml(n), `${(n.title||'笔记').slice(0,30) || '笔记'}.pdf`);
      showToast("PDF 已生成");
    }catch(e){
      console.error(e);
      showToast("导出失败：" + e.message, true);
    }finally{
      state.exporting = false;
      render();
    }
  }

  async function exportReflectionPdf(r){
    if(!r || state.exporting) return;
    state.exporting = true;
    render();
    try{
      await renderHtmlToPdf(reflectionToPdfHtml(r), `反思-${r.date}.pdf`);
      showToast("PDF 已生成");
    }catch(e){
      console.error(e);
      showToast("导出失败：" + e.message, true);
    }finally{
      state.exporting = false;
      render();
    }
  }

  async function exportAllToPdf(){
    if(state.exporting) return;
    if(state.notes.length===0 && state.reflections.length===0){
      showToast("还没有内容可以导出");
      return;
    }
    state.exporting = true;
    render();

    try{
      let html = `
        <div style="font-size:24px;font-weight:700;margin:0 0 6px;">我的笔记本</div>
        <div style="font-size:11px;color:#8A8479;margin-bottom:18px;">导出于 ${fmtDateTime(new Date().toISOString())}　·　共 ${state.notes.length} 条笔记，${state.reflections.length} 篇反思</div>
        <div style="border-top:1px solid #E3DDCD;margin-bottom:20px;"></div>
      `;

      if(state.notes.length){
        html += `<div style="font-size:16px;font-weight:700;margin-bottom:14px;">笔记</div>`;
        const sortedNotes = state.notes.slice().sort((a,b)=> b.updated.localeCompare(a.updated));
        sortedNotes.forEach((n, idx)=>{
          html += `<div style="margin-bottom:18px;${idx>0?'padding-top:16px;border-top:1px solid #E6E0D4;':''}">${noteToPdfHtml(n)}</div>`;
        });
      }

      if(state.reflections.length){
        html += `<div style="font-size:16px;font-weight:700;margin:8px 0 14px;">每日反思</div>`;
        const sortedR = state.reflections.slice().sort((a,b)=> b.date.localeCompare(a.date));
        sortedR.forEach((r, idx)=>{
          html += `<div style="margin-bottom:18px;${idx>0?'padding-top:16px;border-top:1px solid #E6E0D4;':''}">${reflectionToPdfHtml(r)}</div>`;
        });
      }

      await renderHtmlToPdf(html, `我的笔记本-${todayStr()}.pdf`);
      showToast("PDF 已生成");
    }catch(e){
      console.error(e);
      showToast("导出失败：" + e.message, true);
    }finally{
      state.exporting = false;
      render();
    }
  }

  /* ============ boot ============ */
  // Guarded by the `state.loaded` check inside loadAll() itself, so even if
  // both the event listener and the immediate readyState check were to fire
  // in unusual host environments, we will not read storage twice or risk a
  // stale read clobbering a freshly-saved entry.
  document.addEventListener("DOMContentLoaded", loadAll);
  if(document.readyState !== "loading") loadAll();

})();
</script>
</body>
</html>
